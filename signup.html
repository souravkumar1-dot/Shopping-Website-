<!DOCTYPE html>
<html>
<head>
    <title>Signup - ShopEasy</title>

    <link rel="stylesheet" href="../style.css">

</head>

<body>

<div class="form-container">

<h2>Create Account</h2>

<input
type="text"
id="name"
placeholder="Full Name">

<input
type="email"
id="email"
placeholder="Email">

<input
type="password"
id="password"
placeholder="Password">

<button onclick="signup()">
Create Account
</button>

<p>

Already Registered?

<a href="login.html">

Login

</a>

</p>

</div>

<script src="../script.js"></script>

</body>
</html>
